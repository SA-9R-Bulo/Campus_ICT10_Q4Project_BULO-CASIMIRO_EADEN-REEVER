<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Attendance Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

  <div class="card p-4">

    <h1 class="text-center mb-4">
      Attendance Tracker
    </h1>

    <!-- BUTTON TO MAIN PAGE -->
    <a href="main.html"
       class="btn btn-secondary mb-4">
       Go to Main Page
    </a>

    <div class="mb-3">

      <label class="form-label">
        Select Day
      </label>

      <select id="day" class="form-select">

        <option>Monday</option>
        <option>Tuesday</option>
        <option>Wednesday</option>
        <option>Thursday</option>
        <option>Friday</option>

      </select>

    </div>

    <div class="mb-3">

      <label class="form-label">
        Number of Absences
      </label>

      <input
        type="number"
        id="absences"
        class="form-control">

    </div>

    <button
      class="btn btn-primary mb-4"
      onclick="updateGraph()">

      Submit

    </button>

    <canvas id="attendanceChart"></canvas>

  </div>

</div>

<script>

const days = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday"
];

const absenceData = [0, 0, 0, 0, 0];

const ctx =
    document.getElementById("attendanceChart");

const chart = new Chart(ctx, {

    type: "bar",

    data: {

        labels: days,

        datasets: [{

            label: "Absences",

            data: absenceData,

            borderWidth: 1

        }]
    },

    options: {

        responsive: true,

        scales: {

            y: {

                beginAtZero: true

            }
        }
    }

});

function updateGraph() {

    const day =
        document.getElementById("day").value;

    const absences =
        parseInt(
            document.getElementById("absences").value
        );

    const index =
        days.indexOf(day);

    absenceData[index] = absences;

    chart.update();

    document.getElementById("absences").value = "";
}

</script>

</body>
</html>
