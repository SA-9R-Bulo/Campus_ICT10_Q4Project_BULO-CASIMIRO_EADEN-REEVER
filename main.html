<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>School Main Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .card {
      width: 300px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<h1>Welcome to the School Portal of OBMC 25-26</h1>

<div class="container">
  <div class="cards">
    <div class="card bg-light p-4">
      <h4>Classmates System</h4>
      <p>Manage and view your classmates.</p>
      <a href="classmates.html" class="btn btn-primary">Go to Classmates</a>
    </div>
    <div class="card bg-light p-4">
      <h4>Highlights</h4>
      <p>View memorable moments and photos.</p>
      <a href="highlights.html" class="btn btn-success">View Highlights</a>
    </div>
    <div class="card bg-light p-4">
      <h4>Attendance Tracker</h4>
      <p>Track your weekly attendance.</p>
      <a href="attendance.html" class="btn btn-info">Track Attendance</a>
    </div>
  </div>
</div>

<!-- Optional: Add a logout button -->
<div class="text-center mt-4">
  <button class="btn btn-danger" onclick="logout()">Logout</button>
</div>

<script>
  function logout() {
    window.location.href = "index.html";
  }
</script>

</body>
</html>
